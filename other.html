<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px 58px;background:#f0fff7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2d7054}
.page{max-width:680px;margin:0 auto}
.back{display:inline-flex;align-items:center;margin-bottom:18px;padding:9px 14px;border:1px solid #b8f0d4;border-radius:999px;background:#fff;color:#2d7a5a;text-decoration:none;font-size:14px;box-shadow:0 4px 14px rgba(45,122,90,.07)}

.card-title{font-size:20px;font-weight:900;color:#2d7a5a;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.item{position:relative;padding-left:16px;line-height:1.78;font-size:15px;color:#426f58}
.item:before{content:"";position:absolute;left:0;top:.82em;width:6px;height:6px;border-radius:50%;background:#70c99a}
