<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电视剧&电影</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px 58px;background:#f0f6ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#254866}
.page{max-width:680px;margin:0 auto}
.back{display:inline-flex;align-items:center;margin-bottom:18px;padding:9px 14px;border:1px solid #b9d7ff;border-radius:999px;background:#fff;color:#2a5a8a;text-decoration:none;font-size:14px;box-shadow:0 4px 14px rgba(42,90,138,.07)}
.header{text-align:center;margin:10px 0 22px}
.header h1{margin:0;font-family:"Noto Serif SC","Songti SC",serif;font-size:35px;letter-spacing:.04em;color:#24517f}
.header .sub{margin-top:8px;font-size:14px;color:#6f91b4;letter-spacing:.08em}
.block{margin-top:18px;padding:18px;border:1.5px solid #bfdcff;border-radius:24px;background:rgba(255,255,255,.92);box-shadow:0 9px 25px rgba(42,90,138,.06)}
.block-title{font-size:22px;font-weight:900;color:#24517f;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.work{margin-top:14px;padding:16px;border:1px solid #d8e8ff;border-radius:20px;background:#f8fbff}
.work:first-of-type{margin-top:0}
.name{font-size:19px;font-weight:900;color:#234e78;margin-bottom:9px}
.text{line-height:1.85;font-size:15px;color:#3e6385;margin:6px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{padding:6px 10px;border-radius:999px;background:#eef6ff;border:1px solid #c8e0ff;color:#2e5f8d;font-size:13px;font-weight:700}
.review{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid #d5e6ff;background:#fff}
.review img{display:block;width:100%;height:auto}
.movie{border-color:#bfdcff;background:rgba(255,255,255,.92)}.work.movie{border-color:#d8e8ff;background:#f8fbff}.movie .name{color:#234e78}.movie .tag{background:#eef6ff;border-color:#c8e0ff;color:#2e5f8d}.movie .text{color:#3e6385}.movie .review{border-color:#d5e6ff}
@media(max-width:430px){body{padding:20px 14px 46px}.header h1{font-size:30px}.block{padding:15px}.work{padding:14px}.name{font-size:18px}}
</style>
</head>
