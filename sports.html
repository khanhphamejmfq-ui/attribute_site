<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>竞体</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐️</text></svg>">
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 20px 60px;background:#fff7ec;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#70410f}
.page{max-width:560px;margin:auto}
.back{display:inline-block;margin-bottom:26px;padding:9px 14px;border:1px solid #f0b35f;border-radius:999px;background:#fff;color:#9a5b13;text-decoration:none;box-shadow:0 4px 14px rgba(154,91,19,.08)}
.head{text-align:center;margin-bottom:24px}
.emoji{font-size:44px}
h1{margin:8px 0 6px;font-family:"Noto Serif SC","Songti SC",serif;font-size:38px;color:#9a5b13;letter-spacing:.08em}
.sub{margin:0;color:#b4762b;font-size:14px;letter-spacing:.08em}
.section{margin-top:18px;padding:18px;border:1.5px solid #f0b35f;border-radius:22px;background:rgba(255,255,255,.9);box-shadow:0 9px 25px rgba(154,91,19,.07)}
h2{margin:0 0 14px;font-size:22px;color:#9a5b13}
.item{padding:15px 16px;border:1px solid #f4c98f;border-radius:18px;background:#fffaf2;line-height:1.85;color:#70410f;font-size:15px}
.item p{margin:4px 0}
.top{font-weight:900;font-size:17px;color:#8a4d0f}
@media(max-width:430px){body{padding:24px 16px 50px}h1{font-size:34px}.section{padding:16px}.item{font-size:15px}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="index.html">‹ 回到首页</a>
<div class="head">
<div class="emoji">🏆</div>
<h1>竞体</h1>
<p class="sub">SPORTS</p>
</div>

<section class="section">
<h2>🏓 乒乓球</h2>
<div class="item">
<p class="top">🔝 马龙</p>
<p>还喜欢许昕、刘诗雯</p>
<p>嗑龙蟒，喜欢龙蟒枣cb</p>
</div>
</section>

<section class="section">
<h2>⛸ 短道速滑</h2>
<div class="item">
<p class="top">王濛</p>
<p>不公不嬷不梦，单纯的喜欢</p>
</div>
</section>

<section class="section">
<h2>⚽️ 足球</h2>

<p class="top">C罗</p>
<p>恶俗嬷嬷，有时候脑洞很阴间，近期考古中🔍</p>
</div>
</section>

</main>
</body>
</html>
