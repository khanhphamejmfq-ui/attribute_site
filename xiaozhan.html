<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>肖战</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px 56px;background:#fff7f9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#5f2430}
.page{max-width:640px;margin:0 auto}
.back{display:inline-flex;align-items:center;margin-bottom:18px;padding:9px 14px;border:1px solid #f4c8d1;border-radius:999px;background:#fff;color:#9a2d42;text-decoration:none;font-size:14px;box-shadow:0 4px 14px rgba(160,60,80,.06)}
.hero{border-radius:24px;overflow:hidden;background:#fff;border:1px solid #f5d5dc;box-shadow:0 14px 36px rgba(143,49,70,.13)}
.hero img{display:block;width:100%;height:auto}
.header{text-align:center;margin:24px 0 18px}
.header h1{margin:0;font-family:"Noto Serif SC","Songti SC",serif;font-size:38px;letter-spacing:.08em;color:#7f2234}
.header .sub{margin-top:8px;font-size:14px;color:#b36b78;letter-spacing:.12em}
.card{margin-top:15px;padding:18px 18px 19px;border:1px solid #f3ccd4;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 8px 24px rgba(160,60,80,.055)}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:13px;font-size:17px;font-weight:800;color:#8d2a3d}
.tags{display:flex;flex-wrap:wrap;gap:9px}
.tag{padding:7px 12px;border-radius:999px;background:#fff0f3;border:1px solid #f4bcc8;color:#8f2a3d;font-size:14px;font-weight:700}
.list{display:flex;flex-direction:column;gap:9px}
.item{position:relative;padding-left:15px;line-height:1.75;font-size:15px;color:#70414b}
.item:before{content:"";position:absolute;left:0;top:.82em;width:5px;height:5px;border-radius:50%;background:#d77f91}
.text{line-height:1.85;font-size:15px;color:#70414b;margin:0}
.names{line-height:1.9;font-size:15px;color:#70414b;margin:0}
.quote{margin:0;text-align:center;font-size:18px;line-height:1.85;font-weight:800;color:#842638;letter-spacing:.03em}
@media(max-width:430px){body{padding:20px 14px 46px}.header h1{font-size:34px}.card{padding:16px}.quote{font-size:17px}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="index.html">‹ 回到首页</a>

<div class="hero">
<img src="https://i.postimg.cc/y6SR1NVx/Screenshot-20260525-194725-com-ss-android-ugc-aweme-Main-Activity-edit-2082464866319194.jpg" alt="肖战">
</div>

<header class="header">
<h1>肖战</h1>
<div class="sub">XIAO ZHAN</div>
</header>

<section class="card">
<div class="card-title">粉籍定位</div>
<div class="tags">
<span class="tag">生命粉</span>
<span class="tag">演员粉</span>
<span class="tag">唯粉</span>
<span class="tag">整肃</span>
<span class="tag">萌追</span>
</div>
</section>

<section class="card">
<div class="card-title">追星心态</div>
<div class="list">
<div class="item">肖战全肯定</div>
<div class="item">肖战角色全肯定</div>
<div class="item">尊重肖战个人意志</div>
<div class="item">支持肖战的一切选择，包括但不限于职业规划、剧本选择、角色理解、活动造型等</div>
</div>
</section>

<section class="card">
<div class="card-title">追星节奏</div>
<p class="text">有剧看剧，有电影看电影，有活动看活动。都没有就先溜走搞点别的，等赞儿出现再回来。</p>
</section>

<section class="card">
<div class="card-title">称呼</div>
<p class="names">肖战 / 战战 / 哥哥 / 宝宝 / 赞儿 / 赞比……</p>
</section>

<section class="card">
<p class="quote">本人肖战全肯定，<br>支持肖战的一切选择。</p>
</section>
</main>
</body>
</html>
